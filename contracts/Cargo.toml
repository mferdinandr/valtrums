[workspace]
resolver = "2"
members = ["arena", "integration", "mock-dex", "mock-ft", "router"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5"
near-contract-standards = "5"
uint = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
