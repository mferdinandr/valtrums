schema: spec-driven

context: |
  Valtrum's current source is described in docs/current-state.md.
  Target requirements are docs/product-spec.md and the unimplemented change
  redesign-permissionless-robinhood-arena. Target networks are NEAR testnet and
  Robinhood Chain testnet. Write artifacts in English. Amounts are integer units.
  DAO mechanism and audit tax/admin policy remain OPEN; do not invent parameters.

rules:
  proposal:
    - Distinguish target changes from implemented behavior and list breaking changes.
  design:
    - Document custody, oracle, signer, operator and player authorization trust boundaries.
    - Preserve unresolved DAO and audit decisions as OPEN.
  tasks:
    - Leave implementation tasks unchecked until implementation and verification are complete.
