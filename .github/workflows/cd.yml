name: CD testnet

# Called only after all CI jobs pass; deployment credentials never enter PR jobs.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cd-testnet-${{ github.repository }}
  cancel-in-progress: false

jobs:
  agent-image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import os
          image = "ghcr.io/" + os.environ["REPOSITORY"].lower() + "-agent"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={image}\nref={image}:sha-{os.environ['COMMIT_SHA']}\n")
          PYCODE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested agent source
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: AGENT_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image for operators
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Agent image: `%s@%s`\n\nPublishing does not start an agent process.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: testnet
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_NEAR_NETWORK: testnet
      NEXT_PUBLIC_FUNDING_ROUTER: mock
    steps:
      - name: Require configured testnet hosting
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              printf '::error::Missing %s; see docs/ci-cd.md for testnet setup.\n' "$name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@52.0.0
      - name: Pull linked project configuration
        run: vercel pull --yes --environment=production
      - name: Reject accidental mainnet configuration
        run: python3 scripts/check-testnet-env.py .vercel/.env.production.local
      - name: Build testnet web
        run: vercel build --prod
      - name: Deploy prebuilt testnet web
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes)"
          case "$deployment_url" in
            https://*) ;;
            *) printf '::error::Vercel did not return an HTTPS deployment URL.\n'; exit 1 ;;
          esac
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Testnet web: %s\nCommit: `%s`\n' "$deployment_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
