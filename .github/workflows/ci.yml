name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --exclude valtrum-integration

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test -p valtrum-integration

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -F @valtrum/agent test
      - run: pnpm -F @valtrum/web test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          load: true
          push: false
          tags: valtrum-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate a throwaway key for the smoke test
        id: key
        run: |
          KEY=$(node -e '
            const c = require("crypto");
            const { privateKey, publicKey } = c.generateKeyPairSync("ed25519");
            const seed = privateKey.export({ type: "pkcs8", format: "der" }).subarray(-32);
            const pub = publicKey.export({ type: "spki", format: "der" }).subarray(-32);
            const bytes = Buffer.concat([seed, pub]);
            const A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
            let n = BigInt("0x" + bytes.toString("hex"));
            let out = "";
            while (n > 0n) { out = A[Number(n % 58n)] + out; n /= 58n; }
            for (const b of bytes) { if (b !== 0) break; out = "1" + out; }
            console.log("ed25519:" + out);
          ')
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Smoke test /healthz (offline, throwaway key)
        run: |
          docker run -d --name agent --read-only --network none \
            -e ARENA_CONTRACT_ID=arena.testnet \
            -e AGENT_ACCOUNT_ID=agent.testnet \
            -e AGENT_PRIVATE_KEY=${{ steps.key.outputs.key }} \
            -e HEALTH_PORT=8080 \
            valtrum-agent:ci
          for i in $(seq 1 15); do
            if docker exec agent node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"; then
              echo "healthz ok"; exit 0
            fi
            sleep 1
          done
          docker logs agent
          exit 1
